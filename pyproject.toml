[project]
name = "envirospace-monitor"
version = "0.3.4"
description = "Repo for helping to capture environmental data to help with INC Lab: https://www.yorksj.ac.uk/research/institute-for-social-justice/research-clusters/neurodiversity-and-learning-disabilities/inc-lab/"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ads1015>=1.0.0",
    "gpiod>=2.6.0",
    "gpiodevice>=0.1.0",
    "ltr559>=1.0.0",
    "pimoroni-bme280>=1.0.0",
    "pms5003>=1.0.1",
    "sounddevice>=0.5.6",
    "st7735>=1.0.0",
]

[project.scripts]
envirospace-monitor = "envirospace_monitor:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
